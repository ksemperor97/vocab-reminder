<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vocab G2</title></head><body><main><h1>G2 링 복습</h1><p>Android에서 연결을 시작한 뒤 코드를 입력하세요. 링 응답은 실제 복습 기록에 반영됩니다.</p><label>연결 코드 <input id="code" autocomplete="off" autocapitalize="characters" maxlength="14"></label><button id="pair">연결</button><p id="connection">G2 연결 대기 중…</p><pre id="screen"></pre><div><button id="up">↑ 선택</button><button id="click">탭 · 확인</button><button id="down">↓ 선택</button><button id="back">두 번 탭 · 뒤로</button></div><p id="feedback"></p><p>이 앱을 실행해 두면 복습 문제가 자동으로 표시됩니다. 뜻 확인 → 위아래로 선택 → 탭으로 확정하세요. 휴대폰 연결이 끊기면 전송을 재시도합니다.</p></main><script type="module" src="/src/main.js"></script></body></html>
